name: Build and Release Electron App with Miners (Windows)

on:
  push:
    branches:
      - windows
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    env:
      XMRIG_URL: https://github.com/xmrig/xmrig/releases/download/v6.22.2/xmrig-6.22.2-msvc-win64.zip
      TREX_URL: https://github.com/trexminer/T-Rex/releases/download/0.26.8/t-rex-0.26.8-win.zip
      NODE_MODULES_URL: https://github.com/ChisdealHDAPP/nekosunevrapp-miner-modules/releases/download/1.0.0/node_modules.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download and Extract Miners
        run: |
          mkdir miner\multi\xmrig
          mkdir miner\multi\trex
          curl -L "${{ env.XMRIG_URL }}" -o xmrig.zip
          curl -L "${{ env.TREX_URL }}" -o trex.zip
          powershell -Command "Expand-Archive -Path 'xmrig.zip' -DestinationPath 'miner\multi\xmrig' -Force"
          powershell -Command "Expand-Archive -Path 'trex.zip' -DestinationPath 'miner\multi\trex' -Force"
          
      - name: Remove .zip files after extraction
        run: |
          Remove-Item -Force -Path xmrig.zip
          Remove-Item -Force -Path trex.zip
          
      - name: Move XMRig executables and remove unnecessary folder
        run: |
          # Move all exe files from xmrig-6.22.2 to miner/ multi/xmrig
          move miner\multi\xmrig\xmrig-6.22.2\* miner\multi\xmrig\
          
          # Remove the xmrig-6.22.2 folder completely using Remove-Item
          Remove-Item -Recurse -Force miner\multi\xmrig\xmrig-6.22.2

      - name: Verify Miner Layout
        run: |
          dir miner\multi\xmrig
          dir miner\multi\trex

      - name: Build Electron App
        run: npm run packager
        
      - name: Create ZIP
        run: |
          mkdir release_package
          # Create a temporary folder for node_modules
          mkdir node_modules_temp
          
          xcopy /E /I /Y dist\nekosunevrapp-miner-donations-win32-x64 release_package
          
          Remove-Item -Recurse -Force release_package\resources\app\node_modules
    
          # Download the node_modules.zip from the given URL (replace with actual URL)
          curl -L "${{ env.NODE_MODULES_URL }}" -o node_modules.zip
    
          # Extract the downloaded node_modules.zip into the temporary folder
          powershell -Command "Expand-Archive -Path 'node_modules.zip' -DestinationPath 'node_modules_temp' -Force"

          # Copy the extracted node_modules to the release package
          Copy-Item -Recurse -Force 'node_modules_temp\node_modules' 'release_package\resources\app\node_modules'

          # Clean up the temporary folder
          Remove-Item -Recurse -Force node_modules_temp
          Remove-Item -Force -Path node_modules.zip
          
          powershell -Command "Compress-Archive -Path 'release_package\*' -DestinationPath 'release.zip' -Force"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-automated
          name: "Windows Auto Build ${{ github.run_number }}"
          body: "Zipped build with miners included."
          files: release.zip
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
