name: Build and Release Electron App with Miners (Windows)

on:
  push:
    branches:
      - windows
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    env:
      XMRIG_URL: https://github.com/xmrig/xmrig/releases/download/v6.22.2/xmrig-6.22.2-msvc-win64.zip
      TREX_URL: https://github.com/trexminer/T-Rex/releases/download/0.26.8/t-rex-0.26.8-win.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Download and Extract Miners
        run: |
          mkdir miner\multi\xmrig
          mkdir miner\multi\trex
          curl -L "${{ env.XMRIG_URL }}" -o xmrig.zip
          curl -L "${{ env.TREX_URL }}" -o trex.zip
          powershell -Command "Expand-Archive -Path 'xmrig.zip' -DestinationPath 'miner\multi\xmrig' -Force"
          powershell -Command "Expand-Archive -Path 'trex.zip' -DestinationPath 'miner\multi\trex' -Force"

      - name: Verify Miner Layout
        run: |
          dir miner\multi\xmrig
          dir miner\multi\trex

      - name: Build Electron App
        run: npm run packager
        
      - name: Create ZIP
        run: |
          mkdir release_package
          xcopy /E /I /Y dist release_package\dist
          xcopy /E /I /Y miner\multi release_package\multi
          powershell -Command "Compress-Archive -Path 'release_package\*' -DestinationPath 'release.zip' -Force"


      - name: Create Git Tag (optional if not tagging manually)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag windows-$(date +%Y%m%d%H%M%S)
          git push origin --tags

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-automated
          name: "Windows Auto Build ${{ github.run_number }}"
          body: "?? Zipped build with miners included."
          files: release.zip
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
